version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      include: "scope"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
      time: "07:05"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      go-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
      go-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker"
    # Includes Dockerfile and Dockerfile-goreleaser. CI/release Go versions
    # are read from Dockerfile so Go image updates update every build path.
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:10"
      timezone: "Europe/Berlin"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 5
