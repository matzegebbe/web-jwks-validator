name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker Login
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Go version from Dockerfile
        id: toolchain
        run: sed -n 's/^FROM golang:\([0-9.]*\)-.*$/version=\1/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}

      - name: Test Go application
        run: go test ./...

      - name: Check Go vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ${{ steps.toolchain.outputs.version }}
          repo-checkout: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
